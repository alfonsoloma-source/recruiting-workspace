[package]
name = "recruiting-workspace"
version = "0.1.0"
description = "Open-source local-first recruiting workspace"
authors = ["Recruiting Workspace contributors"]
edition = "2021"

[lib]
name = "recruiting_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
