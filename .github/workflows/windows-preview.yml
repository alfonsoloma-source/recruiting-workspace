name: Windows Preview

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows preview
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - name: Create preview icons
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/icons | Out-Null
          Add-Type -AssemblyName System.Drawing
          $bitmap = New-Object System.Drawing.Bitmap 256,256
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::FromArgb(255,32,32,30))
          $font = New-Object System.Drawing.Font("Arial",72,[System.Drawing.FontStyle]::Bold)
          $brush = [System.Drawing.Brushes]::White
          $graphics.DrawString("RW",$font,$brush,38,78)
          $bitmap.Save("$PWD/src-tauri/icons/icon.png",[System.Drawing.Imaging.ImageFormat]::Png)
          $icon = [System.Drawing.Icon]::FromHandle($bitmap.GetHicon())
          $stream = [System.IO.File]::Create("$PWD/src-tauri/icons/icon.ico")
          $icon.Save($stream)
          $stream.Close()
          $icon.Dispose()
          $graphics.Dispose()
          $bitmap.Dispose()
      - name: Build Tauri installer
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: recruiting-workspace-windows-preview
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
